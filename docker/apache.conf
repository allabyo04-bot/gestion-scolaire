ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

# Fichiers du site : les noms changent à chaque version, on peut les garder longtemps en cache
# (moins de données à télécharger sur une connexion faible)
<LocationMatch "^/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
# La page d'accueil, elle, doit toujours être relue pour récupérer la dernière version
<LocationMatch "^/(index\.html)?$">
    Header set Cache-Control "no-cache"
</LocationMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set X-Frame-Options "SAMEORIGIN"
